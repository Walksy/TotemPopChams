plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

subprojects {
    apply from: rootProject.file('gradle/totempopchams-version.gradle')
}

tasks.register('collectJars', Copy) {
    group = 'build'
    description = 'Builds every Minecraft version and copies the release jars into build/libs.'
    into layout.buildDirectory.dir('libs')
    subprojects.each { sub ->
        def jarTask = sub.tasks.names.contains('remapJar') ? 'remapJar' : 'jar'
        from(sub.tasks.named(jarTask))
    }
}